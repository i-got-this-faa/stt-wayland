[workspace]
resolver = "2"
members = ["proto", "sttd", "sttctl"]
default-members = ["proto", "sttd", "sttctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["stt-wayland contributors"]

[workspace.dependencies]
# Shared / IPC
proto = { path = "proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
toml = "0.8"

# Async / runtime
tokio = { version = "1.43", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "signal",
] }

# CLI / config
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audio / VAD / STT
# pipewire 0.8 fails to compile against PipeWire ≥1.4 (spa_pod_builder layout).
pipewire = "0.9"
webrtc-vad = "0.4"
# audio.cpp engine (ggml-based) via the audio-cpp bindings. The model-* features
# compile the ASR families shipped in sttd's model catalog into the C++ engine.
audio-cpp = { version = "0.2", features = [
    "model-qwen3-asr",
    "model-parakeet-tdt",
    "model-nemotron-asr",
    "model-citrinet-asr",
] }

# GUI overlay — keep gtk4 / gtk4-layer-shell / glib / libadwaita on a matched gtk-rs line.
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk4-layer-shell = "0.4"
glib = "0.20"
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }

# Post-processing (local text-normalization models, e.g. superwhisper/s1-mini).
# Pure-Rust ggml via candle; tokenizers only needs the onig regex backend.
candle-core = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Wayland injection (virtual-keyboard-unstable-v1)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# Tray (StatusNotifierItem over D-Bus)
ksni = { version = "0.3", features = ["blocking"] }
resvg = "0.45"

# Misc
libc = "0.2"

# HTTP (model download)
ureq = "2"
sha2 = "0.10"
