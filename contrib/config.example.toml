# Example sttd configuration.
# Install to: ~/.config/sttd/config.toml

[audio]
# Whisper + webrtc-vad expect 16 kHz mono f32.
sample_rate = 16000
channels = 1
# Silence gap that closes a speech chunk (milliseconds).
silence_gap_ms = 500
# Bounded mpsc capacity for VAD → STT backpressure (number of chunks).
stt_channel_capacity = 8
# Optional PipeWire source node name (omit for default).
# node_name = "alsa_input.usb-..."

[model]
# File under directory (or absolute path).
name = "ggml-base.en.bin"
# Default: ~/.local/share/sttd/models/
# directory = "/home/you/.local/share/sttd/models"
# preload = load at daemon start; lazy = load on first Start.
residency = "preload"
# 0 = library default / auto.
threads = 0
language = "en"

[overlay]
enabled = true
# In-progress preview crossfade (ms); Live mode overlay-only.
preview_crossfade_ms = 200
# Edit buffer cap in seconds (~5 minutes).
edit_buffer_cap_secs = 300

[injection]
# Requires compositor support for virtual-keyboard-unstable-v1.
enabled = true
# Delay between characters (ms); 0 = batch as fast as protocol allows.
char_delay_ms = 0
