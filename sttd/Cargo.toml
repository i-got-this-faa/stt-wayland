[package]
name = "sttd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wayland speech-to-text daemon (PipeWire + audio.cpp + gtk4 overlay)"
publish = false

[[bin]]
name = "sttd"
path = "src/main.rs"

[[bin]]
name = "stt-settings"
path = "src/settings.rs"
required-features = ["settings"]

[features]
default = ["audio", "stt-engine", "overlay", "inject", "tray", "settings", "post-process"]
# Optional feature gates so proto/cli (and minimal daemon stubs) can check without
# full system libraries. Default enables the full stack when libs are present.
audio = ["dep:pipewire"]
stt-engine = ["dep:audio-cpp", "dep:webrtc-vad"]
overlay = ["dep:gtk4", "dep:gtk4-layer-shell", "dep:glib"]
inject = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-misc"]
tray = ["dep:ksni", "dep:resvg"]
settings = ["dep:gtk4", "dep:adw", "dep:sha2"]
post-process = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:sha2"]

[dependencies]
proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true, optional = true }

# Optional system-backed crates (enabled by default features)
pipewire = { workspace = true, optional = true }
webrtc-vad = { workspace = true, optional = true }
audio-cpp = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
gtk4-layer-shell = { workspace = true, optional = true }
glib = { workspace = true, optional = true }
adw = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
wayland-protocols-misc = { workspace = true, optional = true }
ksni = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }

# Post-processing (text normalization)
candle-core = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
